name: Linux Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (empty = 0.0.0+git.<sha>)"
        required: false
        default: ""
      formats:
        description: "Formats: tar,deb,rpm or all"
        required: false
        default: "tar,deb,rpm"
  push:
    tags:
      - "v*"

permissions:
  # read for checkout/build; write so tag builds can attach assets to the GitHub Release
  contents: write

jobs:
  package:
    name: Build packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # Uncomment when arm64 runners are available on the org:
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl ca-certificates binutils \
            libcurl4-openssl-dev libxml2-dev libsqlite3-0 libncurses-dev \
            zlib1g-dev libzstd-dev libedit-dev uuid-dev pkg-config \
            dpkg-dev fakeroot rpm \
            bun 2>/dev/null || true
          # bun may not be in apt — install via official script if missing
          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Swift 6.2.3
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            URL="https://download.swift.org/swift-6.2.3-release/ubuntu2404/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE-ubuntu24.04.tar.gz"
          else
            URL="https://download.swift.org/swift-6.2.3-release/ubuntu2404-aarch64/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE-ubuntu24.04-aarch64.tar.gz"
          fi
          curl -fL "$URL" -o /tmp/swift.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar -xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"
          /opt/swift/usr/bin/swift --version

      - name: Build SPA
        run: |
          cd frontend
          bun install
          bun run build
          test -f dist/index.html

      - name: Build release binary
        run: swift build -c release --product BarkVisorApp

      - name: Build packages
        env:
          VERSION: ${{ github.event.inputs.version || '' }}
          FORMATS: ${{ github.event.inputs.formats || 'tar,deb,rpm' }}
          FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
          OUT_DIR: ${{ github.workspace }}/build/linux-packages
          SWIFT_LINUX_LIBDIR: /opt/swift/usr/lib/swift/linux
        run: |
          if [ -z "$VERSION" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          chmod +x scripts/build-linux-packages.sh scripts/lib/linux-package-stage.sh
          chmod +x packaging/linux/debian/postinst packaging/linux/debian/prerm packaging/linux/debian/postrm
          ./scripts/build-linux-packages.sh .build/release/BarkVisorApp

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: barkvisor-linux-${{ matrix.arch }}
          path: |
            build/linux-packages/*.deb
            build/linux-packages/*.rpm
            build/linux-packages/*.tar.gz
            build/linux-packages/*.sha256
            build/linux-packages/MANIFEST.txt
            build/linux-packages/arch/PKGBUILD
          if-no-files-found: error

      # Attach Linux packages to the GitHub Release for this tag.
      # workflow_dispatch keeps CI artifacts only (no Release mutation).
      # Uses --clobber so re-running the tag workflow refreshes Linux assets without
      # removing differently named macOS .pkg files on the same release.
      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mapfile -t files < <(
            find build/linux-packages -maxdepth 1 -type f \
              \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.sha256' \) \
              | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: no package files under build/linux-packages to upload" >&2
            exit 1
          fi
          echo "Uploading ${#files[@]} file(s) to release $TAG:"
          printf '  %s\n' "${files[@]}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "BarkVisor ${TAG#v}" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
