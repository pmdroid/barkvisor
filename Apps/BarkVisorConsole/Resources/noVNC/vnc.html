<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Display</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111417; overflow: hidden; }
    #screen { position: absolute; inset: 0; touch-action: none; }
    #screen canvas { touch-action: none; }
  </style>
</head>
<body>
  <div id="screen"></div>
  <script type="module">
    import RFB from "./core/rfb.js";

    // Keep in lockstep with HostPasteboard.maxPasteCharacters and PINNED.txt.
    const MAX_CLIPBOARD = 1000000;
    const PINNED_NOVNC = "1.6.0";
    const MAX_ZOOM = 4;
    let rfb = null;
    let viewport = null;
    let userZoom = 1;
    let pinch = null;
    let applyingZoom = false;

    function post(payload) {
      try {
        window.webkit.messageHandlers.novnc.postMessage(payload);
      } catch (_) {
        /* native host not attached */
      }
    }

    function screenSize() {
      const el = document.getElementById("screen");
      return { w: el.clientWidth || 1, h: el.clientHeight || 1 };
    }

    function clampZoom(value) {
      return Math.min(MAX_ZOOM, Math.max(1, value));
    }

    function applyFit() {
      userZoom = 1;
      if (rfb) {
        rfb.dragViewport = false;
        rfb.resizeSession = true;
        rfb.scaleViewport = true;
        rfb.clipViewport = false;
      }
      post({ type: "zoom", scale: 1 });
    }

    // noVNC 1.6.0 has public clip/scale/resize flags, but pinch-zoom still
    // needs Display viewport methods RFB does not expose. Probe that surface
    // and refuse to hook if a bundled upgrade drops it.
    function viewportAdapter(instance) {
      if (!instance) return null;
      const display = instance._display;
      if (!display) return null;
      const needed = [
        display.viewportChangeSize,
        display.viewportChangePos,
        display.absX,
        display.absY,
        instance._updateClip,
        instance._updateScale
      ];
      if (needed.some((fn) => typeof fn !== "function")) return null;
      if (typeof display.width !== "number" || typeof display.height !== "number") {
        return null;
      }
      return {
        version: PINNED_NOVNC,
        display,
        canvas() {
          return document.querySelector("#screen canvas");
        },
        fbSize() {
          return { w: display.width || 0, h: display.height || 0 };
        },
        enterZoomed() {
          instance.resizeSession = false;
          instance.scaleViewport = false;
          instance.clipViewport = true;
          instance.dragViewport = true;
        },
        hookResize(onZoomed) {
          const origClip = instance._updateClip.bind(instance);
          const origScale = instance._updateScale.bind(instance);
          instance._updateClip = () => {
            if (userZoom <= 1) origClip();
            else onZoomed();
          };
          instance._updateScale = () => {
            if (userZoom <= 1) origScale();
            else onZoomed();
          };
        }
      };
    }

    function applyZoomedViewport() {
      if (!rfb || !viewport || applyingZoom) return;
      const size = screenSize();
      const fb = viewport.fbSize();
      if (fb.w < 1 || fb.h < 1) return;
      const fit = Math.min(size.w / fb.w, size.h / fb.h);
      const scale = Math.max(fit * userZoom, 0.01);
      applyingZoom = true;
      try {
        viewport.enterZoomed();
        if (!viewport.display.clipViewport) {
          viewport.display.clipViewport = true;
        }
        viewport.display.scale = scale;
        viewport.display.viewportChangeSize(size.w / scale, size.h / scale);
      } finally {
        applyingZoom = false;
      }
    }

    function setZoom(next, focal) {
      next = clampZoom(next);
      if (!rfb) {
        userZoom = next;
        return;
      }
      if (!viewport || next <= 1.001) {
        applyFit();
        return;
      }
      let guestX;
      let guestY;
      const canvas = viewport.canvas();
      if (focal && canvas && userZoom > 1) {
        const rect = canvas.getBoundingClientRect();
        guestX = viewport.display.absX(focal.x - rect.left);
        guestY = viewport.display.absY(focal.y - rect.top);
      }
      userZoom = next;
      applyZoomedViewport();
      if (focal && canvas && guestX !== undefined) {
        const rect = canvas.getBoundingClientRect();
        const nx = viewport.display.absX(focal.x - rect.left);
        const ny = viewport.display.absY(focal.y - rect.top);
        viewport.display.viewportChangePos(guestX - nx, guestY - ny);
      }
      post({ type: "zoom", scale: userZoom });
    }

    function touchDistance(a, b) {
      return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }

    function touchMid(a, b) {
      return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
    }

    function onTouchStart(event) {
      if (event.touches.length < 2) return;
      event.preventDefault();
      event.stopPropagation();
      pinch = {
        dist: touchDistance(event.touches[0], event.touches[1]),
        zoom: userZoom,
        mid: touchMid(event.touches[0], event.touches[1])
      };
    }

    function onTouchMove(event) {
      if (!pinch || event.touches.length < 2) return;
      event.preventDefault();
      event.stopPropagation();
      const dist = Math.max(touchDistance(event.touches[0], event.touches[1]), 1);
      const mid = touchMid(event.touches[0], event.touches[1]);
      const next = clampZoom(pinch.zoom * (dist / pinch.dist));
      if (Math.abs(next - userZoom) > 0.001) {
        setZoom(next, mid);
      } else if (userZoom > 1 && viewport) {
        const size = screenSize();
        const fb = viewport.fbSize();
        const fw = fb.w || 1;
        const fh = fb.h || 1;
        const scale = Math.max(Math.min(size.w / fw, size.h / fh) * userZoom, 0.01);
        viewport.display.viewportChangePos((pinch.mid.x - mid.x) / scale, (pinch.mid.y - mid.y) / scale);
      }
      pinch.mid = mid;
    }

    function onTouchEnd(event) {
      if (!pinch) return;
      if (event.touches.length >= 2) return;
      event.preventDefault();
      event.stopPropagation();
      pinch = null;
    }

    const screen = document.getElementById("screen");
    const touchOpts = { capture: true, passive: false };
    screen.addEventListener("touchstart", onTouchStart, touchOpts);
    screen.addEventListener("touchmove", onTouchMove, touchOpts);
    screen.addEventListener("touchend", onTouchEnd, touchOpts);
    screen.addEventListener("touchcancel", onTouchEnd, touchOpts);

    window.startVNC = (url) => {
      const previous = rfb;
      rfb = null;
      viewport = null;
      if (previous) {
        try { previous.disconnect(); } catch (_) { /* ignore */ }
      }
      userZoom = 1;
      pinch = null;
      let mine;
      try {
        mine = new RFB(document.getElementById("screen"), url, {
          credentials: { password: "" }
        });
      } catch (_) {
        post({ type: "disconnect", clean: false });
        return;
      }
      rfb = mine;
      viewport = viewportAdapter(mine);
      mine.scaleViewport = true;
      mine.resizeSession = true;
      mine.clipViewport = false;
      mine.dragViewport = false;
      mine.focusOnClick = true;
      mine.qualityLevel = 4;
      mine.compressionLevel = 2;
      if (viewport) {
        viewport.hookResize(applyZoomedViewport);
      }
      mine.addEventListener("connect", () => {
        if (rfb !== mine) return;
        const fb = viewport ? viewport.fbSize() : { w: 0, h: 0 };
        applyFit();
        post({ type: "connect", width: fb.w, height: fb.h });
        try { mine.focus(); } catch (_) { /* ignore */ }
      });
      mine.addEventListener("disconnect", (event) => {
        if (rfb !== mine) return;
        const clean = !!(event && event.detail && event.detail.clean);
        rfb = null;
        viewport = null;
        userZoom = 1;
        pinch = null;
        post({ type: "disconnect", clean });
      });
      mine.addEventListener("clipboard", (event) => {
        const text = event && event.detail ? String(event.detail.text || "") : "";
        if (text.length > MAX_CLIPBOARD) {
          post({ type: "clipboard", oversized: true });
          return;
        }
        post({ type: "clipboard", text });
      });
    };

    window.sendCtrlAltDel = () => {
      if (rfb) rfb.sendCtrlAltDel();
    };

    window.focusVNC = () => {
      if (rfb) rfb.focus();
    };

    window.stopVNC = () => {
      if (!rfb) return;
      try { rfb.disconnect(); } catch (_) { /* ignore */ }
      rfb = null;
      viewport = null;
      userZoom = 1;
      pinch = null;
    };

    window.resetZoom = () => {
      applyFit();
    };

    window.pasteClipboard = (text) => {
      if (rfb && typeof text === "string" && text) {
        rfb.clipboardPasteFrom(text);
      }
    };

    post({ type: "ready" });
  </script>
</body>
</html>
