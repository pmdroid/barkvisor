<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Display</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111417; overflow: hidden; }
    #screen { position: absolute; inset: 0; touch-action: none; }
    #screen canvas { touch-action: none; }
  </style>
</head>
<body>
  <div id="screen"></div>
  <script type="module">
    import RFB from "./core/rfb.js";

    const MAX_ZOOM = 4;
    let rfb = null;
    let userZoom = 1;
    let pinch = null;

    function post(payload) {
      try {
        window.webkit.messageHandlers.novnc.postMessage(payload);
      } catch (_) {
        /* native host not attached */
      }
    }

    function screenSize() {
      const el = document.getElementById("screen");
      return { w: el.clientWidth || 1, h: el.clientHeight || 1 };
    }

    function clampZoom(value) {
      return Math.min(MAX_ZOOM, Math.max(1, value));
    }

    function applyFit() {
      userZoom = 1;
      if (rfb) {
        rfb.dragViewport = false;
        rfb.resizeSession = true;
        rfb.scaleViewport = true;
        rfb.clipViewport = false;
      }
      post({ type: "zoom", scale: 1 });
    }

    function applyZoomedViewport() {
      if (!rfb || !rfb._display) return;
      const display = rfb._display;
      const size = screenSize();
      const fw = rfb._fbWidth || 0;
      const fh = rfb._fbHeight || 0;
      if (fw < 1 || fh < 1) return;
      const fit = Math.min(size.w / fw, size.h / fh);
      const scale = Math.max(fit * userZoom, 0.01);
      rfb._resizeSession = false;
      rfb._scaleViewport = false;
      rfb._clipViewport = true;
      rfb.dragViewport = true;
      if (!display.clipViewport) {
        display.clipViewport = true;
      }
      display.scale = scale;
      display.viewportChangeSize(size.w / scale, size.h / scale);
    }

    function installResizeHooks() {
      const origClip = rfb._updateClip.bind(rfb);
      const origScale = rfb._updateScale.bind(rfb);
      rfb._updateClip = () => {
        if (userZoom <= 1) origClip();
        else applyZoomedViewport();
      };
      rfb._updateScale = () => {
        if (userZoom <= 1) origScale();
        else applyZoomedViewport();
      };
    }

    function setZoom(next, focal) {
      next = clampZoom(next);
      if (!rfb) {
        userZoom = next;
        return;
      }
      if (next <= 1.001) {
        applyFit();
        return;
      }
      let guestX;
      let guestY;
      if (focal && rfb._display && rfb._canvas && userZoom > 1) {
        const rect = rfb._canvas.getBoundingClientRect();
        guestX = rfb._display.absX(focal.x - rect.left);
        guestY = rfb._display.absY(focal.y - rect.top);
      }
      userZoom = next;
      applyZoomedViewport();
      if (focal && rfb._display && rfb._canvas && guestX !== undefined) {
        const rect = rfb._canvas.getBoundingClientRect();
        const nx = rfb._display.absX(focal.x - rect.left);
        const ny = rfb._display.absY(focal.y - rect.top);
        rfb._display.viewportChangePos(guestX - nx, guestY - ny);
      }
      post({ type: "zoom", scale: userZoom });
    }

    function touchDistance(a, b) {
      return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }

    function touchMid(a, b) {
      return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
    }

    function onTouchStart(event) {
      if (event.touches.length < 2) return;
      event.preventDefault();
      event.stopPropagation();
      pinch = {
        dist: touchDistance(event.touches[0], event.touches[1]),
        zoom: userZoom,
        mid: touchMid(event.touches[0], event.touches[1])
      };
    }

    function onTouchMove(event) {
      if (!pinch || event.touches.length < 2) return;
      event.preventDefault();
      event.stopPropagation();
      const dist = Math.max(touchDistance(event.touches[0], event.touches[1]), 1);
      const mid = touchMid(event.touches[0], event.touches[1]);
      const next = clampZoom(pinch.zoom * (dist / pinch.dist));
      if (Math.abs(next - userZoom) > 0.001) {
        setZoom(next, mid);
      } else if (userZoom > 1 && rfb && rfb._display) {
        const size = screenSize();
        const fw = rfb._fbWidth || 1;
        const fh = rfb._fbHeight || 1;
        const scale = Math.max(Math.min(size.w / fw, size.h / fh) * userZoom, 0.01);
        rfb._display.viewportChangePos((pinch.mid.x - mid.x) / scale, (pinch.mid.y - mid.y) / scale);
      }
      pinch.mid = mid;
    }

    function onTouchEnd(event) {
      if (!pinch) return;
      if (event.touches.length >= 2) return;
      event.preventDefault();
      event.stopPropagation();
      pinch = null;
    }

    const screen = document.getElementById("screen");
    const touchOpts = { capture: true, passive: false };
    screen.addEventListener("touchstart", onTouchStart, touchOpts);
    screen.addEventListener("touchmove", onTouchMove, touchOpts);
    screen.addEventListener("touchend", onTouchEnd, touchOpts);
    screen.addEventListener("touchcancel", onTouchEnd, touchOpts);

    window.startVNC = (url) => {
      const previous = rfb;
      rfb = null;
      if (previous) {
        try { previous.disconnect(); } catch (_) { /* ignore */ }
      }
      userZoom = 1;
      pinch = null;
      let mine;
      try {
        mine = new RFB(document.getElementById("screen"), url, {
          credentials: { password: "" }
        });
      } catch (_) {
        post({ type: "disconnect", clean: false });
        return;
      }
      rfb = mine;
      mine.scaleViewport = true;
      mine.resizeSession = true;
      mine.clipViewport = false;
      mine.dragViewport = false;
      mine.focusOnClick = true;
      mine.qualityLevel = 4;
      mine.compressionLevel = 2;
      installResizeHooks();
      mine.addEventListener("connect", () => {
        if (rfb !== mine) return;
        const width = mine._fbWidth || 0;
        const height = mine._fbHeight || 0;
        applyFit();
        post({ type: "connect", width, height });
        try { mine.focus(); } catch (_) { /* ignore */ }
      });
      mine.addEventListener("disconnect", (event) => {
        if (rfb !== mine) return;
        const clean = !!(event && event.detail && event.detail.clean);
        rfb = null;
        userZoom = 1;
        pinch = null;
        post({ type: "disconnect", clean });
      });
      mine.addEventListener("clipboard", (event) => {
        const text = event && event.detail ? String(event.detail.text || "") : "";
        post({ type: "clipboard", text });
      });
    };

    window.sendCtrlAltDel = () => {
      if (rfb) rfb.sendCtrlAltDel();
    };

    window.focusVNC = () => {
      if (rfb) rfb.focus();
    };

    window.stopVNC = () => {
      if (!rfb) return;
      try { rfb.disconnect(); } catch (_) { /* ignore */ }
      rfb = null;
      userZoom = 1;
      pinch = null;
    };

    window.resetZoom = () => {
      applyFit();
    };

    window.pasteClipboard = (text) => {
      if (rfb && typeof text === "string" && text) {
        rfb.clipboardPasteFrom(text);
      }
    };

    post({ type: "ready" });
  </script>
</body>
</html>
