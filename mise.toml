[tools]
swift = '6.3'
swiftformat = '0.61.0'
swiftlint = '0.63.2'
bun = '1.3'

[env]
XCODE_DEFAULT_TOOLCHAIN_OVERRIDE = { value = "{{ tools.swift.path }}", tools = true }

[settings]
experimental = true

[tasks.lint]
description = "Run SwiftLint and SwiftFormat checks"
run = [
    "swiftlint lint --quiet",
    "swiftformat --lint Sources/ Tests/",
]

[tasks.build]
description = "Build the Swift package in release mode"
run = "swift build -c release"

[tasks.test]
description = "Run the test suite"
run = "swift test"

[tasks.frontend-test]
description = "Run frontend unit tests"
dir = "frontend"
run = ["bun install", "bun test"]

[tasks.prepush]
description = "Local CI gate: lint + Swift tests + frontend tests (must pass before push)"
depends = ["lint", "test", "frontend-test"]

# PAS-183 guest-boot BDD is opt-in. Do not add these to [tasks.prepush]:
# TCG Ubuntu boots can take ~15 minutes (SSH_WAIT_SECS=900).
[tasks.guest-smoke]
description = "Opt-in blank-disk guest-boot BDD (fast; not in default prepush)"
run = "./scripts/guest-boot-bdd.sh blank"

[tasks.guest-smoke-real]
description = "Opt-in REAL_GUEST Ubuntu cloud-image BDD (long; TCG ~15 min)"
run = "./scripts/guest-boot-bdd.sh real"

[tasks.api-bdd]
description = "Opt-in API contract BDD: probe every OpenAPI operation (fast, no QEMU)"
run = "./scripts/api-contract-bdd.sh"

[tasks.prepush-full]
description = "Opt-in: prepush + API contract BDD + blank-disk guest-smoke (never the default push gate)"
depends = ["prepush", "api-bdd", "guest-smoke"]

# PAS-185 cross-Device Home proxy smoke is opt-in. Do not add to [tasks.prepush].
# Two daemons + real pairing; needs an RFC1918 address for join redeem.
[tasks.cross-device-smoke]
description = "Opt-in two-Device Home proxy smoke (not in default prepush)"
run = "./scripts/cross-device-smoke.sh"

[tasks.website]
description = "Build unified landing + docs site (website/dist)"
dir = "website"
run = ["bun install", "bun run build"]

[tasks.website-deploy]
description = "Build and deploy website to Cloudflare Pages"
dir = "website"
run = ["bun install", "bun run deploy"]
