[tools]
swift = '6.3'
swiftformat = '0.61.0'
swiftlint = '0.63.2'
bun = '1.3'

[env]
XCODE_DEFAULT_TOOLCHAIN_OVERRIDE = { value = "{{ tools.swift.path }}", tools = true }

[settings]
experimental = true

[tasks.lint]
description = "Run SwiftLint and SwiftFormat checks"
run = [
    "swiftlint lint --quiet",
    "swiftformat --lint Sources/ Tests/",
]

[tasks.build]
description = "Build the Swift package in release mode"
run = "swift build -c release"

[tasks.test]
description = "Run the test suite"
run = "swift test"

[tasks.frontend-test]
description = "Run frontend unit tests"
dir = "frontend"
run = ["bun install", "bun test"]

[tasks.website]
description = "Build unified landing + docs site (website/dist)"
dir = "website"
run = ["bun install", "bun run build"]

[tasks.website-deploy]
description = "Build and deploy website to Cloudflare Pages"
dir = "website"
run = ["bun install", "bun run deploy"]
