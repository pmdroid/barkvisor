  /api/pairing/codes:
    post:
      tags: [evolving]
      operationId: issuePairingCode
      x-barkvisor-stability: evolving
      summary: Issue a short-lived pairing code and QR payload
      description: |
        Authenticated issuer (existing Device). Creates a single-use code
        (default 10 minutes) and a `barkvisor://pair/v1` QR URI that carries
        address, hostId, and Device certificate fingerprint. A new issue
        replaces any previous unused code. `advertisedHost` is baked into
        `host=` and persisted so GET after reload matches.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                advertisedHost:
                  type: string
                  description: |
                    Address written to `host=` on the pairing URI. A LAN IPv4
                    (RFC1918), IPv6 ULA, CGNAT `100.64.0.0/10`, or a DNS name.
                    Not resolved at issue time. Rejected: localhost, `.internal`,
                    public and metadata addresses (`169.254.169.254`,
                    `100.100.100.200`), whitespace, and path characters.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingIssue"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [evolving]
      operationId: getPairingCode
      x-barkvisor-stability: evolving
      summary: Current unused pairing code, if any
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingIssue"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [evolving]
      operationId: revokePairingCode
      x-barkvisor-stability: evolving
      summary: Revoke the current pairing code
      responses:
        "204":
          description: Revoked or already absent
        default:
          $ref: "#/components/responses/Error"

  /api/pairing/redeem:
    post:
      tags: [evolving]
      operationId: redeemPairingCode
      x-barkvisor-stability: evolving
      summary: Redeem a pairing code; return trust material and shared identity copy
      description: |
        Public, rate-limited. The joining Device presents the short code, its
        Home-CA-issued Device certificate, the issuing Home CA, and a CSR.
        The issuer consumes the code, pins the presented certificate, issues
        a Home-CA cert, and returns trust material including the issued
        agentPort plus optional shared identity copy (issuer jwtSecret and
        adminUser with id, username, and password hash; never a plaintext
        password). Local SQLite still owns VM runtime.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRedeemRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRedeem"
        default:
          $ref: "#/components/responses/Error"

  /api/pairing/join:
    post:
      tags: [evolving]
      operationId: joinPairing
      x-barkvisor-stability: evolving
      summary: Redeem a QR from this Device
      description: |
        Local join: parse the QR payload, call the issuer redeem endpoint,
        pin the issuer fingerprint, and persist the trust bundle including
        agentPort. QR is required so a caller cannot aim server-side HTTP
        redeem at an arbitrary host. Unauthenticated only from this Device
        (loopback) until setup completes; after setup, JWT is required.
        Join targets must resolve to RFC1918 or IPv6 ULA addresses. Rate
        limited with the pairing limiter, which stays on when login
        limiting is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingJoinRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingJoin"
        default:
          $ref: "#/components/responses/Error"

  /api/home/devices:
    get:
      tags: [evolving]
      operationId: listHomeDevices
      x-barkvisor-stability: evolving
      summary: This Device plus paired members
      description: |
        JWT. Local registry only — does not probe members. A Device still
        lists itself when peers are unreachable or the registry file is
        missing (PAS-47 / PAS-90). Dashboard UI is PAS-52.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeDeviceList"
        default:
          $ref: "#/components/responses/Error"

  /api/home/devices/health:
    get:
      tags: [evolving]
      operationId: getHomeDeviceHealth
      x-barkvisor-stability: evolving
      summary: Aggregated Device health for the Home dashboard
      description: |
        JWT. This Device is always included from local inventory and
        workload health. Members are probed over mTLS. Hop failures
        use `reachability` codes (`connectTimeout`, `cancelled`,
        `tlsFailure`, `memberHTTP`) instead of claiming the Device is
        offline. A true down member stays `unreachable` with no live
        resources. Local SQLite / QEMU are unchanged (PAS-47).
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeDeviceHealthReport"
        default:
          $ref: "#/components/responses/Error"

  /api/home/placement/score:
    post:
      tags: [evolving]
      operationId: scoreHomePlacement
      x-barkvisor-stability: evolving
      summary: Rank Devices for a create or template deploy
      description: |
        JWT. One recommender (PAS-44 + PAS-43). Hard-fails offline Devices,
        architecture mismatch, missing `requiredFeatures`, and free memory
        below `minMemoryMB` / `requestedMemoryMB`. Eligible Devices are
        ranked by CPU and memory headroom with human-readable reasons.

        Does not place a workload. The SPA pre-selects `recommendedHostId`
        and the operator confirms or overrides. A down peer is ineligible
        and never blocks scoring this Device (PAS-47 / PAS-90). USB/GPU
        peripheral matching is PAS-91.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomePlacementScoreRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePlacementScoreResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/home/devices/{id}/v1/{path}:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Remainder of the member `/api/` path (for example `vms` or `agent/inventory`)
    get:
      tags: [evolving]
      operationId: proxyHomeDeviceGet
      x-barkvisor-stability: internal
      summary: Proxy GET to a Home member over mTLS
      description: |
        JWT on this Device. Forwards to the member agent port with this
        Device's client certificate. Unreachable members return 502;
        local runtime is unchanged. Nested `/api/home/*` is rejected.
      responses:
        default:
          description: Member status and body, or an error envelope
    post:
      tags: [evolving]
      operationId: proxyHomeDevicePost
      x-barkvisor-stability: internal
      summary: Proxy POST to a Home member over mTLS
      responses:
        default:
          description: Member status and body, or an error envelope
    put:
      tags: [evolving]
      operationId: proxyHomeDevicePut
      x-barkvisor-stability: internal
      summary: Proxy PUT to a Home member over mTLS
      responses:
        default:
          description: Member status and body, or an error envelope
    patch:
      tags: [evolving]
      operationId: proxyHomeDevicePatch
      x-barkvisor-stability: internal
      summary: Proxy PATCH to a Home member over mTLS
      responses:
        default:
          description: Member status and body, or an error envelope
    delete:
      tags: [evolving]
      operationId: proxyHomeDeviceDelete
      x-barkvisor-stability: internal
      summary: Proxy DELETE to a Home member over mTLS
      responses:
        default:
          description: Member status and body, or an error envelope

