  /api/ollama/ps:
    get:
      tags: [evolving]
      operationId: getOllamaPs
      x-barkvisor-stability: evolving
      summary: Native Ollama GET /api/ps for this Device
      responses:
        "200":
          description: Running models
        default:
          $ref: "#/components/responses/Error"

  /api/ollama/pull:
    post:
      tags: [evolving]
      operationId: postOllamaPull
      x-barkvisor-stability: evolving
      summary: Pull a model via native Ollama POST /api/pull
      responses:
        "200":
          description: Background pull task
        default:
          $ref: "#/components/responses/Error"

  /api/ollama/start:
    post:
      tags: [evolving]
      operationId: postOllamaStart
      x-barkvisor-stability: evolving
      summary: Load a pulled model after a RAM fit check
      responses:
        "204":
          description: Loaded
        default:
          $ref: "#/components/responses/Error"

  /api/ollama/stop:
    post:
      tags: [evolving]
      operationId: postOllamaStop
      x-barkvisor-stability: evolving
      summary: Unload a running Ollama model
      responses:
        "204":
          description: Unloaded
        default:
          $ref: "#/components/responses/Error"

  /api/ollama/settings:
    get:
      tags: [evolving]
      operationId: getOllamaSettings
      x-barkvisor-stability: evolving
      summary: Per-Device upstream Ollama URLs. Home holds the keys; the raw key is never returned.
      responses:
        "200":
          description: Masked settings for known Devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaSettingsSnapshot"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [evolving]
      operationId: putOllamaSettings
      x-barkvisor-stability: evolving
      summary: Set one Device's loopback Ollama URL and/or upstream API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaSettingsUpdate"
      responses:
        "200":
          description: Masked settings after save
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaSettingsSnapshot"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"

  /api/ollama/v1/chat/completions:
    post:
      tags: [evolving]
      operationId: postOllamaChatCompletions
      x-barkvisor-stability: evolving
      summary: OpenAI chat completions against this Device's Ollama
      responses:
        "200":
          description: Completion
        default:
          $ref: "#/components/responses/Error"

  /api/home/ollama/status:
    get:
      tags: [evolving]
      operationId: getHomeOllamaStatus
      x-barkvisor-stability: evolving
      summary: Home Ollama map and whether Models should show
      responses:
        "200":
          description: Merged catalog plus Device reachability
        default:
          $ref: "#/components/responses/Error"

  /api/home/ollama/models:
    get:
      tags: [evolving]
      operationId: getHomeOllamaModels
      x-barkvisor-stability: evolving
      summary: Merged tags+ps catalog for the Home
      responses:
        "200":
          description: Catalog
        default:
          $ref: "#/components/responses/Error"

  /api/home/ollama/library/search:
    get:
      tags: [evolving]
      operationId: getHomeOllamaLibrarySearch
      x-barkvisor-stability: evolving
      summary: Search the Ollama library through Home
      description: >
        Proxies GET https://ollama.com/api/tags (popular library list; upstream
        ignores ?q=) and filters names with `q`. No durable JSON search exists on
        ollama.com; HTML search is not scraped. Empty `q` returns no results
        without fetching. Host allowlist is ollama.com; SSRFGuard validates the
        fetch. Upstream failure is 502.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Filtered library results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaLibrarySearchResponse"
        "502":
          description: ollama.com is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"

  /api/home/ollama/pull:
    post:
      tags: [evolving]
      operationId: postHomeOllamaPull
      x-barkvisor-stability: evolving
      summary: Pull a model on a chosen Device
      responses:
        "200":
          description: Pull task
        default:
          $ref: "#/components/responses/Error"

  /api/home/ollama/start:
    post:
      tags: [evolving]
      operationId: postHomeOllamaStart
      x-barkvisor-stability: evolving
      summary: Load a model on a Device (prefer running, then healthier)
      responses:
        "204":
          description: Loaded
        default:
          $ref: "#/components/responses/Error"

  /api/home/ollama/settings:
    get:
      tags: [evolving]
      operationId: getHomeOllamaSettings
      x-barkvisor-stability: evolving
      summary: Per-Device upstream Ollama keys stored on Home
      responses:
        "200":
          description: Masked settings for known Devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaSettingsSnapshot"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [evolving]
      operationId: putHomeOllamaSettings
      x-barkvisor-stability: evolving
      summary: Set a Device's upstream Ollama URL and API key on Home
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaSettingsUpdate"
      responses:
        "200":
          description: Masked settings after save
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaSettingsSnapshot"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"

  /api/home/ollama/stop:
    post:
      tags: [evolving]
      operationId: postHomeOllamaStop
      x-barkvisor-stability: evolving
      summary: Unload a model on a Device
      responses:
        "204":
          description: Unloaded
        default:
          $ref: "#/components/responses/Error"

  /api/tags:
    get:
      tags: [evolving]
      operationId: getNativeOllamaTags
      x-barkvisor-stability: evolving
      summary: Native Ollama GET /api/tags for the Home catalog
      responses:
        "200":
          description: Pulled models
        default:
          $ref: "#/components/responses/Error"

  /api/pull:
    post:
      tags: [evolving]
      operationId: postNativeOllamaPull
      x-barkvisor-stability: evolving
      summary: Native Ollama POST /api/pull routed to one Device
      responses:
        "200":
          description: Pull task
        default:
          $ref: "#/components/responses/Error"

  /api/ps:
    get:
      tags: [evolving]
      operationId: getNativeOllamaPs
      x-barkvisor-stability: evolving
      summary: Native Ollama GET /api/ps for running Home models
      responses:
        "200":
          description: Running models
        default:
          $ref: "#/components/responses/Error"

  /api/v1/models:
    get:
      tags: [evolving]
      operationId: getOpenAIModels
      x-barkvisor-stability: evolving
      summary: OpenAI list models from the Home Ollama catalog
      responses:
        "200":
          description: Model list
        default:
          $ref: "#/components/responses/Error"

  /api/v1/chat/completions:
    post:
      tags: [evolving]
      operationId: postOpenAIChatCompletions
      x-barkvisor-stability: evolving
      summary: OpenAI chat completions routed by model name
      responses:
        "200":
          description: JSON completion, or text/event-stream when stream is true
        default:
          $ref: "#/components/responses/Error"

  /v1/models:
    get:
      tags: [evolving]
      operationId: getOpenAIModelsRoot
      x-barkvisor-stability: evolving
      summary: OpenAI list models (Ollama-compatible base URL)
      responses:
        "200":
          description: Model list
        default:
          $ref: "#/components/responses/Error"

  /v1/chat/completions:
    post:
      tags: [evolving]
      operationId: postOpenAIChatCompletionsRoot
      x-barkvisor-stability: evolving
      summary: OpenAI chat completions (Ollama-compatible base URL)
      responses:
        "200":
          description: JSON completion, or text/event-stream when stream is true
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    vmId:
      name: vmId
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0

  responses:
    Error:
      description: Structured error envelope (same on every host)
      headers:
        X-BarkVisor-API-Version:
          schema:
            type: string
            example: "1"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, code, reason, status]
      properties:
        error:
          type: boolean
          const: true
        code:
          type: string
          description: Stable token (`bad_request`, `vm_not_running`, …)
        reason:
          type: string
          description: Human-readable message (safe to show in UI)
        status:
          type: integer
          description: HTTP status repeated in the body

    OllamaHostSettings:
      type: object
      additionalProperties: false
      required: [hostId, endpoint, hasApiKey]
      properties:
        hostId:
          type: string
        endpoint:
          type: string
        hasApiKey:
          type: boolean
          description: True when an effective upstream key is present for this Device (stored on the Device row or inherited from the global key). The key itself is never returned.
        apiKeyMasked:
          type: string
          description: Bullets when an effective key is present (stored or inherited). Never the raw key or a suffix.

    OllamaLibrarySearchResult:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        size:
          type: integer
          format: int64
          nullable: true

    OllamaLibrarySearchResponse:
      type: object
      additionalProperties: false
      required: [query, upstream, results]
      properties:
        query:
          type: string
        upstream:
          type: string
          description: Documented fetch URL, currently https://ollama.com/api/tags
        results:
          type: array
          items:
            $ref: "#/components/schemas/OllamaLibrarySearchResult"

    OllamaSettingsSnapshot:
      type: object
      additionalProperties: false
      required: [hosts]
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/OllamaHostSettings"

    OllamaSettingsUpdate:
      type: object
      additionalProperties: false
      required: [hostId]
      properties:
        hostId:
          type: string
        endpoint:
          type: string
          description: Loopback Ollama URL. Omit to leave the stored URL alone.
        apiKey:
          type: string
          description: Upstream Ollama API key. Omit to leave it; empty string clears it.

    APIContractSummary:
      type: object
      required: [apiVersion, versionHeader, urlVersioning, openapi, errorEnvelope, tiers]
      properties:
        apiVersion:
          type: integer
        versionHeader:
          type: string
        urlVersioning:
          type: string
        openapi:
          type: string
        errorEnvelope:
          type: array
          items:
            type: string
        tiers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        reserved:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    GuestListeningPort:
      type: object
      required: [proto, address, port, scope]
      description: >
        TCP LISTEN from the guest addon. proto is always tcp. scope is
        internal for loopback (never a URL) and network otherwise.
        Only common ports are returned. scheme is http or https when the
        guest answered HTTP (or the port is well-known HTTPS).
      properties:
        proto:
          type: string
          enum: [tcp]
        address:
          type: string
        port:
          type: integer
        scope:
          type: string
          enum: [internal, network]
        label:
          type: string
          nullable: true
        scheme:
          type: string
          nullable: true
          enum: [http, https]

    GuestInfo:
      type: object
      required: [available, ipAddresses, ipSource]
      description: >
        Guest addon snapshot. listeningPorts is null when unavailable and
        [] when the guest reported none. Do not invent ports. Web UIs hide
        the ports section when listeningPorts is null.
      properties:
        available:
          type: boolean
        ipAddresses:
          type: array
          items:
            type: string
        macAddress:
          type: string
          nullable: true
        ipSource:
          type: string
        hostname:
          type: string
          nullable: true
        osName:
          type: string
          nullable: true
        osVersion:
          type: string
          nullable: true
        osId:
          type: string
          nullable: true
        kernelVersion:
          type: string
          nullable: true
        kernelRelease:
          type: string
          nullable: true
        machine:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        timezoneOffset:
          type: integer
          nullable: true
        users:
          type: array
          nullable: true
          items:
            type: object
        filesystems:
          type: array
          nullable: true
          items:
            type: object
        listeningPorts:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/GuestListeningPort"
        portsCollectedAt:
          type: string
          nullable: true

    ProcessHealth:
      type: object
      required: [status, apiVersion, checks, updatedAt]
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        apiVersion:
          type: integer
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
        updatedAt:
          type: string

    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [pass, fail, skip]
        message:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, refreshToken, role]
      properties:
        token:
          type: string
        refreshToken:
          type: string
        role:
          type: string
          enum: [admin, inference]
          description: Home role. Tokens inherit this role. Admin may also mint inference-only API keys.

    AuthMeResponse:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, inference]

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string

    LoginOfferIssueRequest:
      type: object
      properties:
        advertisedHost:
          type: string

    LoginOfferIssue:
      type: object
      required: [code, expiresAt, ttlSeconds, uri, host, port]
      properties:
        code:
          type: string
        expiresAt:
          type: string
        ttlSeconds:
          type: integer
        uri:
          type: string
          description: barkvisor://login/v1?code=…&host=…&port=…
        host:
          type: string
        port:
          type: integer

    PasskeyLoginBeginRequest:
      type: object
      properties:
        username:
          type: string

    PasskeyRegisterBeginRequest:
      type: object
      properties:
        name:
          type: string

    PasskeyCeremonyBegin:
      type: object
      required: [sessionId, publicKey]
      properties:
        sessionId:
          type: string
        publicKey:
          type: object
          additionalProperties: true
          description: WebAuthn PublicKeyCredential options. Binary fields are base64url strings.

    PasskeyLoginFinishRequest:
      type: object
      required: [sessionId, credential]
      properties:
        sessionId:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: navigator.credentials.get JSON. Binary fields are base64url strings.

    PasskeyRegisterFinishRequest:
      type: object
      required: [sessionId, credential]
      properties:
        sessionId:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: navigator.credentials.create JSON. Binary fields are base64url strings.
        name:
          type: string

    PasskeyCredential:
      type: object
      required: [id, name, createdAt, credentialId]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
        lastUsedAt:
          type: string
          nullable: true
        credentialId:
          type: string

    LoginRedeemRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    VM:
      type: object
      description: Dual-read document — `spec`/`status` plus flat fields (PAS-35).
      required:
        - spec
        - status
        - id
        - name
        - vmType
        - state
        - health
        - cpuCount
        - memoryMB
        - bootDiskId
        - uefi
        - tpmEnabled
        - pendingChanges
        - createdAt
        - updatedAt
      properties:
        spec:
          $ref: "#/components/schemas/WorkloadSpec"
        status:
          $ref: "#/components/schemas/VMRuntimeStatus"
        id:
          type: string
        name:
          type: string
        vmType:
          type: string
        state:
          $ref: "#/components/schemas/VMState"
        health:
          $ref: "#/components/schemas/WorkloadHealth"
        cpuCount:
          type: integer
        memoryMB:
          type: integer
        bootDiskId:
          type: string
        isoId:
          type: string
          nullable: true
        isoIds:
          type: array
          nullable: true
          items:
            type: string
        networkId:
          type: string
          nullable: true
        cloudInitPath:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        bootOrder:
          type: string
          nullable: true
        displayResolution:
          type: string
          nullable: true
        additionalDiskIds:
          type: array
          nullable: true
          items:
            type: string
        uefi:
          type: boolean
        tpmEnabled:
          type: boolean
        macAddress:
          type: string
          nullable: true
        sharedPaths:
          type: array
          nullable: true
          items:
            type: string
        portForwards:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PortForwardRule"
        usbDevices:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/USBDevice"
        gpuDevices:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/GPUDevice"
        pendingChanges:
          type: boolean
        startOnBoot:
          type: boolean
          description: >
            Start this Workload after the Device boots. Default false so House
            appliances stay stopped. Daemon restart on the same boot does not start it.
        workloadClass:
          type: string
        session:
          nullable: true
          $ref: "#/components/schemas/CodingAgentSession"
        createdAt:
          type: string
        updatedAt:
          type: string

    CodingAgentSession:
      type: object
      description: Agent coding session TTL, receipt, and actions (PAS-273). Expiry stops the guest; it does not destroy or suspend.
      required: [ttlSeconds, warning, warningLeadSeconds, expiryAction, grant, actions]
      properties:
        ttlSeconds:
          type: integer
        startedAt:
          type: string
          nullable: true
        expiresAt:
          type: string
          nullable: true
        remainingSeconds:
          type: integer
          nullable: true
        warning:
          type: boolean
        warningLeadSeconds:
          type: integer
        expiryAction:
          type: string
          enum: [stop]
        grant:
          type: string
        receipt:
          nullable: true
          $ref: "#/components/schemas/CodingAgentReceipt"
        actions:
          type: array
          items:
            type: string
            enum: [resume, reset, burn]

    CodingAgentReceipt:
      type: object
      required: [stoppedAt, reason, noPush]
      properties:
        stoppedAt:
          type: string
        reason:
          type: string
        lastGitPushAt:
          type: string
          nullable: true
        noPush:
          type: boolean

    VMState:
      type: string
      enum: [stopped, starting, running, stopping, error, provisioning, deleting]

    WorkloadHealth:
      type: string
      enum: [unknown, stopped, starting, running, guest_ready, degraded, failed]

    WorkloadHealthStatus:
      type: object
      required: [health, checks, updatedAt]
      properties:
        health:
          $ref: "#/components/schemas/WorkloadHealth"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
        updatedAt:
          type: string
        lastError:
          type: string
          nullable: true

    WorkloadHealthSummary:
      type: object
      required: [counts, items, updatedAt]
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadHealthSummaryItem"
        updatedAt:
          type: string

    WorkloadHealthSummaryItem:
      type: object
      required: [id, name, kind, health]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        health:
          $ref: "#/components/schemas/WorkloadHealth"
        lastError:
          type: string
          nullable: true

    WorkloadHealthSpec:
      type: object
      description: >
        Optional VM HTTP/TCP probes (PAS-65). Omitted or empty means process-state
        health only. `exec` is App-only and rejected on VirtualMachine.
      properties:
        intervalSec:
          type: integer
          minimum: 5
          maximum: 3600
        timeoutSec:
          type: integer
          minimum: 1
          maximum: 60
        healthyThreshold:
          type: integer
          minimum: 1
          maximum: 20
        unhealthyThreshold:
          type: integer
          minimum: 1
          maximum: 20
        http:
          type: object
          required: [path, port]
          properties:
            path:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            expectedStatus:
              type: integer
              minimum: 100
              maximum: 599
        tcp:
          type: object
          required: [port]
          properties:
            port:
              type: integer
              minimum: 1
              maximum: 65535

    VMRuntimeStatus:
      type: object
      required: [state, pendingChanges, generation, createdAt, updatedAt, health, backend]
      properties:
        state:
          $ref: "#/components/schemas/VMState"
        pendingChanges:
          type: boolean
        generation:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        health:
          $ref: "#/components/schemas/WorkloadHealth"
        healthError:
          type: string
          nullable: true
        backend:
          $ref: "#/components/schemas/VMRuntimeBackend"
        startOnBoot:
          type: boolean
          description: Start after Device boot (host-only, not in the portable spec).

    VMRuntimeBackend:
      type: object
      required: [accelerator, guestArch, qemuBinary, emulated]
      properties:
        accelerator:
          type: string
        guestArch:
          type: string
        qemuBinary:
          type: string
        emulated:
          type: boolean
        warning:
          type: string
          nullable: true

    WorkloadApplyResult:
      type: object
      required: [op, id, generation]
      properties:
        op:
          type: string
          enum: [created, updated, unchanged]
        id:
          type: string
        generation:
          type: integer
        diff:
          $ref: "#/components/schemas/WorkloadApplyDiff"

    WorkloadApplyDiff:
      type: object
      required: [after]
      properties:
        before:
          $ref: "#/components/schemas/WorkloadSpec"
        after:
          $ref: "#/components/schemas/WorkloadSpec"

    WorkloadSpec:
      type: object
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion:
          type: string
          example: barkvisor.dev/v1
        kind:
          type: string
          example: VirtualMachine
        metadata:
          $ref: "#/components/schemas/WorkloadMetadata"
        spec:
          $ref: "#/components/schemas/WorkloadSpecBody"
        overrides:
          $ref: "#/components/schemas/WorkloadOverrides"

    WorkloadOverrides:
      type: object
      nullable: true
      description: >
        Platform-specific spec overlays (PAS-41). The bag matching the target
        host OS is deep-merged onto spec at validate/launch. Raw QEMU argv is
        not accepted.
      properties:
        linux:
          $ref: "#/components/schemas/WorkloadSpecOverlay"
        macos:
          $ref: "#/components/schemas/WorkloadSpecOverlay"

    WorkloadSpecOverlay:
      type: object
      additionalProperties: false
      nullable: true
      properties:
        resources:
          type: object
          nullable: true
          properties:
            cpu:
              type: integer
            memoryMb:
              type: integer
        arch:
          type: string
          nullable: true
        guestType:
          type: string
          nullable: true
        osFamily:
          type: string
          nullable: true
        machine:
          type: string
          nullable: true
        firmware:
          type: object
          nullable: true
          properties:
            uefi:
              type: boolean
            tpm:
              type: boolean
        bootOrder:
          type: string
          nullable: true
        display:
          type: object
          nullable: true
          properties:
            resolution:
              type: string
              nullable: true
        accelerator:
          type: string
          nullable: true
          description: Host-local QEMU accelerator (kvm/hvf/tcg). Capability-gated.
        hugepages:
          type: boolean
          nullable: true
          description: Linux-only huge-page backing (-mem-path /dev/hugepages).

    WorkloadMetadata:
      type: object
      required: [name]
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        labels:
          type: object
          additionalProperties:
            type: string
          nullable: true

    WorkloadSpecBody:
      type: object
      required: [resources]
      properties:
        resources:
          type: object
          required: [cpu, memoryMb]
          properties:
            cpu:
              type: integer
            memoryMb:
              type: integer
        arch:
          type: string
          nullable: true
        guestType:
          type: string
          nullable: true
        osFamily:
          type: string
          nullable: true
        machine:
          type: string
          nullable: true
        firmware:
          type: object
          nullable: true
          properties:
            uefi:
              type: boolean
            tpm:
              type: boolean
        bootOrder:
          type: string
          nullable: true
        disks:
          type: array
          items:
            type: object
        networks:
          type: array
          items:
            type: object
        cloudInit:
          type: object
          nullable: true
        usb:
          type: array
          items:
            $ref: "#/components/schemas/USBDevice"
        gpu:
          type: array
          items:
            $ref: "#/components/schemas/GPUDevice"
        display:
          type: object
          nullable: true
        sharedPaths:
          type: array
          nullable: true
          items:
            type: string
        health:
          $ref: "#/components/schemas/WorkloadHealthSpec"

    CreateVMRequest:
      type: object
      properties:
        name:
          type: string
        vmType:
          type: string
        osFamily:
          type: string
        cpuCount:
          type: integer
        memoryMB:
          type: integer
        diskSizeGB:
          type: integer
        isoId:
          type: string
        cloudImageId:
          type: string
        networkId:
          type: string
        spec:
          $ref: "#/components/schemas/WorkloadSpec"

    UpdateVMRequest:
      type: object
      properties:
        name:
          type: string
        cpuCount:
          type: integer
        memoryMB:
          type: integer
        networkId:
          type: string
        spec:
          $ref: "#/components/schemas/WorkloadSpec"
        startOnBoot:
          type: boolean

    VMTaskAccepted:
      type: object
      required: [taskID, vm]
      properties:
        taskID:
          type: string
        vm:
          $ref: "#/components/schemas/VM"

    Disk:
      type: object
      required: [id, name, path, sizeBytes, format, status, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        sizeBytes:
          type: integer
          format: int64
        format:
          type: string
        vmId:
          type: string
          nullable: true
        autoCreated:
          type: boolean
        status:
          type: string
        createdAt:
          type: string
        attachedTo:
          type: array
          items:
            $ref: "#/components/schemas/DiskAttachment"
          description: VMs currently referencing this disk (boot or additional disk). Present on list/detail responses.

    DiskAttachment:
      type: object
      required: [vmId, vmName]
      properties:
        vmId:
          type: string
        vmName:
          type: string

    CreateDiskRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        sizeGB:
          type: integer
          description: Required for file-backed disks. Ignored when blockDevice is set.
        format:
          type: string
        directory:
          type: string
          description: Absolute directory for this disk file. Defaults to the configured disk directory.
        blockDevice:
          type: string
          description: Linux host block device path such as /dev/sdb. Rejected on macOS.

    ResizeDiskRequest:
      type: object
      required: [sizeGB]
      properties:
        sizeGB:
          type: integer

    DiskUsage:
      type: object
      required: [virtualSizeBytes, actualSizeBytes]
      properties:
        virtualSizeBytes:
          type: integer
          format: int64
        actualSizeBytes:
          type: integer
          format: int64

    StorageSummary:
      type: object
      required:
        - totalVirtualBytes
        - totalActualBytes
        - diskCount
        - volumeTotalBytes
        - volumeAvailableBytes
      properties:
        totalVirtualBytes:
          type: integer
          format: int64
        totalActualBytes:
          type: integer
          format: int64
        diskCount:
          type: integer
        volumeTotalBytes:
          type: integer
          format: int64
        volumeAvailableBytes:
          type: integer
          format: int64

    Network:
      type: object
      required: [id, name, mode, isDefault]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
          enum: [nat, bridged, isolated]
        bridge:
          type: string
          nullable: true
        macAddress:
          type: string
          nullable: true
        dnsServer:
          type: string
          nullable: true
        autoCreated:
          type: boolean
        isDefault:
          type: boolean

    CreateNetworkRequest:
      type: object
      required: [name, mode]
      properties:
        name:
          type: string
        mode:
          type: string
        bridge:
          type: string
        macAddress:
          type: string
        dnsServer:
          type: string

    UpdateNetworkRequest:
      type: object
      properties:
        name:
          type: string
        mode:
          type: string
        bridge:
          type: string
        macAddress:
          type: string
        dnsServer:
          type: string

    NetworkModeCapability:
      type: object
      required: [mode, supported]
      properties:
        mode:
          type: string
        supported:
          type: boolean
        reasonCode:
          type: string
          nullable: true
        remediation:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    CapabilityDetail:
      type: object
      required: [code, supported]
      properties:
        code:
          type: string
          description: Stable capability id on GET /api/system/capabilities (PAS-37 / PAS-274)
          enum:
            - bridgedNetworking
            - managedBridgeDaemon
            - hostBridgeManagement
            - usbPassthrough
            - inAppUpdate
            - kvmDevice
            - qemuBridgeHelper
            - tcgOnly
            - vfio
            - gpuPassthrough
        supported:
          type: boolean
        reasonCode:
          type: string
          nullable: true
          description: Why the capability is unsupported or degraded
          enum:
            - os_unsupported
            - kvm_missing
            - helper_missing
            - interface_missing
            - acl_denied
            - linux_os_managed
            - linux_pkg_update
            - iommu_missing
            - vfio_missing
            - gpu_missing
        remediation:
          type: string
          nullable: true

    Image:
      type: object
      required: [id, name, imageType, arch, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        imageType:
          type: string
        arch:
          type: string
          description: Guest image arch (`arm64` | `x86_64`). Same tokens on every host.
        status:
          type: string
        sizeBytes:
          type: integer
          format: int64
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
          description: Hex SHA-256 of the stored Library file. Null until download/upload completes.
        createdAt:
          type: string
        updatedAt:
          type: string
        downloadPercent:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: >
            In-flight download percent (0-100) from the live downloader.
            Null when total size is unknown or the image is not transferring.

    DownloadImageRequest:
      type: object
      required: [name, url, imageType, arch]
      properties:
        name:
          type: string
        url:
          type: string
        imageType:
          type: string
          enum: [iso, cloud-image]
        arch:
          type: string
          enum: [arm64, x86_64]

    AcquireImageRequest:
      type: object
      required: [name, imageType, arch]
      properties:
        name:
          type: string
        imageType:
          type: string
          enum: [iso, cloud-image]
        arch:
          type: string
          enum: [arm64, x86_64]
        sourceUrl:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true

    PortForwardRule:
      type: object
      required: [protocol, hostPort, guestPort]
      properties:
        protocol:
          type: string
        hostPort:
          type: integer
        guestPort:
          type: integer
        httpPath:
          type: string
          nullable: true

    USBDevice:
      type: object
      required: [vendorId, productId]
      properties:
        vendorId:
          type: string
        productId:
          type: string
        label:
          type: string
          nullable: true
        serialNumber:
          type: string
          nullable: true
        deviceId:
          type: string
          nullable: true
          description: Stable id. Prefer vendorId:productId:serial when serial is present.

    GPUDevice:
      type: object
      required: [pciAddress, iommuGroup, vendorId, deviceId]
      properties:
        pciAddress:
          type: string
        iommuGroup:
          type: string
        vendorId:
          type: string
        deviceId:
          type: string
        label:
          type: string
          nullable: true
        groupAddresses:
          type: array
          items:
            type: string
        pciClass:
          type: string
          nullable: true

    AttachGPURequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string
          description: PCI address (`0000:01:00.0`)

    HostGPUDevice:
      type: object
      required: [id, pciAddress, iommuGroup, vendorId, deviceId, name]
      properties:
        id:
          type: string
        pciAddress:
          type: string
        iommuGroup:
          type: string
        vendorId:
          type: string
        deviceId:
          type: string
        pciClass:
          type: string
          nullable: true
        name:
          type: string
        driver:
          type: string
          nullable: true
        vfioBound:
          type: boolean
        inUseByHost:
          type: boolean
        attachable:
          type: boolean
        excludedReason:
          type: string
          nullable: true
        groupAddresses:
          type: array
          items:
            type: string
        guestOllamaPath:
          type: string
        busy:
          type: boolean
        attachedToVmId:
          type: string
          nullable: true
        claimedByVMId:
          type: string
          nullable: true
        claimedByVMName:
          type: string
          nullable: true

    AttachUSBRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string

    HostUSBDevice:
      type: object
      required: [id, vendorId, productId, name]
      properties:
        id:
          type: string
          description: vendorId:productId:serial, or bus:BBB.AAA when serial is missing
        vendorId:
          type: string
        productId:
          type: string
        name:
          type: string
        productName:
          type: string
        manufacturer:
          type: string
          nullable: true
        serial:
          type: string
          nullable: true
        serialNumber:
          type: string
          nullable: true
        bus:
          type: integer
          nullable: true
        address:
          type: integer
          nullable: true
        idUnstable:
          type: boolean
        attachable:
          type: boolean
        excludedReason:
          type: string
          nullable: true
        busy:
          type: boolean
        attachedToVmId:
          type: string
          nullable: true
        claimedByVMId:
          type: string
          nullable: true
        claimedByVMName:
          type: string
          nullable: true

    SystemCapabilities:
      type: object
      required:
        - platform
        - supportsBridgedNetworking
        - supportsUSBPassthrough
        - accelerator
        - hostArch
        - hostCpuCount
        - maxMemoryMB
        - guestTypes
      properties:
        platform:
          type: string
        supportsBridgedNetworking:
          type: boolean
        supportsManagedBridgeDaemon:
          type: boolean
        supportsHostBridgeManagement:
          type: boolean
        supportsUSBPassthrough:
          type: boolean
        supportsInAppUpdate:
          type: boolean
        supportsGPUPassthrough:
          type: boolean
          description: >
            Linux IOMMU + vfio-pci + KVM + a GPU in an IOMMU group.
            Probe only — not QEMU vfio-pci attach (PAS-274).
        supportsVFIO:
          type: boolean
          description: IOMMU groups exist and vfio-pci (or /dev/vfio/vfio) is present.
        accelerator:
          type: string
        hostArch:
          type: string
        hostCpuCount:
          type: integer
        maxMemoryMB:
          type: integer
        guestTypes:
          type: array
          items:
            type: object
        details:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityDetail"
        inventorySchemaVersion:
          type: integer
        runnableArches:
          type: array
          items:
            type: string
        networkModes:
          type: array
          items:
            $ref: "#/components/schemas/NetworkModeCapability"

    AppInfo:
      type: object
      required: [version, platform, hostArch, accelerator]
      properties:
        version:
          type: string
        platform:
          type: string
        hostArch:
          type: string
        accelerator:
          type: string
        processUptimeSeconds:
          type: integer

    LibrarySettings:
      type: object
      additionalProperties: false
      required: [imageDirectory, isDefault, libraryDepotHostId, totalBytes, freeBytes, usedBytes]
      properties:
        imageDirectory:
          type: string
          description: Resolved Library directory used for new downloads
        isDefault:
          type: boolean
          description: True when the path is the default `{dataDir}/images`
        libraryDepotHostId:
          type: string
          nullable: true
          description: Paired Device to fetch missing Library images from first
        totalBytes:
          type: integer
          minimum: 0
          nullable: true
          description: Size of the volume that contains imageDirectory; null when unreadable (never 0 as a stand-in)
        freeBytes:
          type: integer
          minimum: 0
          nullable: true
          description: Free bytes on that volume; null when unreadable (never 0 as a stand-in)
        usedBytes:
          type: integer
          minimum: 0
          nullable: true
          description: totalBytes minus freeBytes when both are present

    LibrarySettingsRequest:
      type: object
      additionalProperties: false
      properties:
        imageDirectory:
          type: string
          nullable: true
          description: Absolute writable path, or empty to reset to `{dataDir}/images`
        libraryDepotHostId:
          type: string
          nullable: true
          description: Paired Device host id, or empty to clear (internet only)

    DiskSettings:
      type: object
      additionalProperties: false
      required: [diskDirectory, isDefault]
      properties:
        diskDirectory:
          type: string
          description: Resolved directory used for new VM disk files
        isDefault:
          type: boolean
          description: True when the path is the default `{dataDir}/disks`

    DiskSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        diskDirectory:
          type: string
          nullable: true
          description: Absolute writable path, or empty to reset to `{dataDir}/disks`

    HostBlockDevice:
      type: object
      additionalProperties: false
      required: [path, name, sizeBytes, attachable]
      properties:
        path:
          type: string
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        model:
          type: string
          nullable: true
        attachable:
          type: boolean
        excludedReason:
          type: string
          nullable: true

    TailnetInfo:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available:
          type: boolean
          description: True when `tailscale ip -4` returned a usable address
        ip:
          type: string
          nullable: true
        dnsName:
          type: string
          nullable: true
          description: MagicDNS name from `tailscale status --json`, trailing dot stripped

    WireGuardInfo:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Best-effort; a wgN interface or `wg show interfaces` is present

    RemoteAccessStatus:
      type: object
      additionalProperties: false
      required: [tailscale, wireguard, advertiseUrl, requireTailnetForRemote, advertisedHosts]
      properties:
        tailscale:
          $ref: "#/components/schemas/TailnetInfo"
        wireguard:
          $ref: "#/components/schemas/WireGuardInfo"
        advertiseUrl:
          type: string
          nullable: true
          description: Host stamped on pairing/login QR when the operator does not pick another
        requireTailnetForRemote:
          type: boolean
        advertisedHosts:
          type: array
          items:
            type: string
          description: Same picker list as pairing/login offers — hostname, LAN, Tailscale IP/MagicDNS

    RemoteAccessUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        requireTailnetForRemote:
          type: boolean
        advertiseUrl:
          type: string
          nullable: true
          description: Host or URL; empty clears. Omitted leaves the stored value.

    LibraryDepotImage:
      type: object
      additionalProperties: false
      required: [id, name, imageType, arch, status]
      properties:
        id:
          type: string
        name:
          type: string
        imageType:
          type: string
        arch:
          type: string
        status:
          type: string
        sizeBytes:
          type: integer
          format: int64
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
        filename:
          type: string
          nullable: true

    PairingIssue:
      type: object
      required:
        [
          code,
          expiresAt,
          ttlSeconds,
          qrPayload,
          hostId,
          fingerprint,
          caFingerprint,
          port,
          agentPort,
          advertisedHosts,
          apiVersion,
        ]
      properties:
        code:
          type: string
        expiresAt:
          type: string
        ttlSeconds:
          type: integer
        qrPayload:
          type: string
        hostId:
          type: string
        fingerprint:
          type: string
        caFingerprint:
          type: string
        port:
          type: integer
        agentPort:
          type: integer
        advertisedHost:
          type: string
          description: Host baked into qrPayload `host=` when the offer was issued.
        advertisedHosts:
          type: array
          items:
            type: string
          description: |
            Selectable issuer addresses: RFC1918 IPv4, IPv6 ULA, and CGNAT
            `100.64.0.0/10`. Loopback, link-local, public, and metadata are
            omitted.
        apiVersion:
          type: integer

    PairingRedeemRequest:
      type: object
      required: [code, hostId, csrPEM, deviceCertificatePEM, caCertificatePEM, apiVersion]
      properties:
        code:
          type: string
        hostId:
          type: string
        csrPEM:
          type: string
        deviceCertificatePEM:
          type: string
        caCertificatePEM:
          type: string
        apiVersion:
          type: integer
        agentHost:
          type: string
          description: Optional joiner agent-plane address for the issuer registry
        agentPort:
          type: integer
          description: Optional joiner agent-plane port (default 7778)

    PairingRedeem:
      type: object
      required:
        [
          hostId,
          deviceCertificatePEM,
          deviceFingerprint,
          caCertificatePEM,
          caFingerprint,
          issuedCertificatePEM,
          issuedFingerprint,
          agentPort,
          apiVersion,
        ]
      properties:
        hostId:
          type: string
        deviceCertificatePEM:
          type: string
        deviceFingerprint:
          type: string
        caCertificatePEM:
          type: string
        caFingerprint:
          type: string
        issuedCertificatePEM:
          type: string
        issuedFingerprint:
          type: string
        agentPort:
          type: integer
        apiVersion:
          type: integer
        jwtSecret:
          type: string
          description: >
            Optional issuer Home JWT HMAC secret (dataDir/jwt-secret).
            Omitted when the issuer has no secret to copy.
        adminUser:
          $ref: "#/components/schemas/PairingAdminUser"
          description: >
            Optional first password-backed admin row copied from the issuer.
            Omitted when no such user exists.

    PairingAdminUser:
      type: object
      description: Admin row copied at pair time. Password is the stored hash only.
      required: [id, username, passwordHash]
      properties:
        id:
          type: string
        username:
          type: string
        passwordHash:
          type: string
          description: bcrypt hash; never a plaintext password

    PairingJoinRequest:
      type: object
      required: [qrPayload]
      properties:
        qrPayload:
          type: string
        code:
          type: string
        host:
          type: string
        port:
          type: integer
        hostId:
          type: string
        fingerprint:
          type: string

    PairingJoin:
      type: object
      required: [peerHostId, peerFingerprint, issuedFingerprint, agentPort, pinned, apiVersion]
      properties:
        peerHostId:
          type: string
        peerFingerprint:
          type: string
        issuedFingerprint:
          type: string
        agentPort:
          type: integer
        pinned:
          type: boolean
        apiVersion:
          type: integer

    AgentPeerIdentity:
      type: object
      required: [hostId, fingerprint, trust, listener]
      properties:
        hostId:
          type: string
        fingerprint:
          type: string
          description: SHA-256 of the leaf certificate DER, lowercase hex
        trust:
          type: string
          enum: [home-ca, pinned]
        listener:
          type: string
          enum: [mtls]

    HomeDevice:
      type: object
      required: [hostId, role, agentPort]
      properties:
        hostId:
          type: string
        role:
          type: string
          enum: [self, member]
        fingerprint:
          type: string
        displayName:
          type: string
        agentHost:
          type: string
        agentPort:
          type: integer
        pairedAt:
          type: string

    HomeDeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/HomeDevice"

    HomeDevicePlatformSummary:
      type: object
      required: [os, arch]
      properties:
        os:
          type: string
        arch:
          type: string

    HomeDeviceResourceSummary:
      type: object
      properties:
        cpuCount:
          type: integer
        memoryTotalMB:
          type: integer
        memoryUsedMB:
          type: integer
        cpuLoadPercent:
          type: number

    HomeDeviceHealthSnapshot:
      type: object
      required: [hostId, role, agentPort, reachability]
      properties:
        hostId:
          type: string
        role:
          type: string
          enum: [self, member]
        displayName:
          type: string
        fingerprint:
          type: string
        agentHost:
          type: string
        agentPort:
          type: integer
        pairedAt:
          type: string
        reachability:
          type: string
          enum: [ok, unreachable, connectTimeout, cancelled, tlsFailure, memberHTTP, responseTooLarge]
        reachabilityError:
          type: string
        collectedAt:
          type: string
        platform:
          $ref: "#/components/schemas/HomeDevicePlatformSummary"
        resources:
          $ref: "#/components/schemas/HomeDeviceResourceSummary"
        features:
          $ref: "#/components/schemas/HomeDeviceFeatureSummary"
        workloadCount:
          type: integer
        healthCounts:
          type: object
          additionalProperties:
            type: integer

    HomeDeviceFeatureSummary:
      type: object
      required: [kvmDevice, bridgedNetworking, usbPassthrough]
      properties:
        kvmDevice:
          type: boolean
        bridgedNetworking:
          type: boolean
        usbPassthrough:
          type: boolean
        gpuPassthrough:
          type: boolean
          description: >
            Host can bind a GPU with vfio-pci (Linux IOMMU + vfio + KVM + a GPU).
            Absent on older member health JSON (decode as false). Not QEMU attach.
        vfio:
          type: boolean
          description: IOMMU groups exist and vfio-pci (or /dev/vfio/vfio) is present.

    HomePlacementScoreRequest:
      type: object
      properties:
        declaredArchitectures:
          type: array
          items:
            type: string
        requiredFeatures:
          type: array
          items:
            type: string
        minMemoryMB:
          type: integer
        requestedMemoryMB:
          type: integer

    HomePlacementReason:
      type: object
      required: [code, kind, message]
      properties:
        code:
          type: string
        kind:
          type: string
          enum: [hard, soft]
        message:
          type: string

    HomePlacementCandidate:
      type: object
      required: [hostId, role, eligible, recommended, rank, score, reasons]
      properties:
        hostId:
          type: string
        displayName:
          type: string
        role:
          type: string
        eligible:
          type: boolean
        recommended:
          type: boolean
        rank:
          type: integer
        score:
          type: integer
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/HomePlacementReason"

    HomePlacementScoreResponse:
      type: object
      required: [recommendedHostId, candidates]
      properties:
        recommendedHostId:
          type: string
          nullable: true
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/HomePlacementCandidate"

    HomeDeviceHealthTotals:
      type: object
      required: [devices, reachable, unreachable, workloadCount, healthCounts]
      properties:
        devices:
          type: integer
        reachable:
          type: integer
        unreachable:
          type: integer
        workloadCount:
          type: integer
          nullable: true
        healthCounts:
          type: object
          additionalProperties:
            type: integer

    HomeDeviceHealthReport:
      type: object
      required: [devices, totals]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/HomeDeviceHealthSnapshot"
        totals:
          $ref: "#/components/schemas/HomeDeviceHealthTotals"

    HostInventory:
      type: object
      required: [schemaVersion, hostId, displayName, agent, platform, collectedAt]
      properties:
        schemaVersion:
          type: integer
        hostId:
          type: string
        displayName:
          type: string
        agent:
          $ref: "#/components/schemas/AgentInfo"
        platform:
          type: object
          required: [os, osVersion, arch, hostname]
          properties:
            os:
              type: string
            osVersion:
              type: string
            arch:
              type: string
            hostname:
              type: string
        collectedAt:
          type: string
        networking:
          type: object
          properties:
            tailnet:
              $ref: "#/components/schemas/TailnetInfo"

    AgentInfo:
      type: object
      required: [role, version, apiVersion]
      properties:
        role:
          type: string
        version:
          type: string
        apiVersion:
          type: integer
          description: Matches X-BarkVisor-API-Version
