openapi: "3.1.0"
info:
  title: BarkVisor HTTP API
  version: "1"
  summary: Stable cross-platform host API
  description: |
    One JSON API on macOS and Linux. Resource schemas do not fork by host OS.

    **Versioning:** unversioned `/api` is v1. Every `/api` response includes
    `X-BarkVisor-API-Version: 1`. `AgentInfo.apiVersion` matches. Breaking
    changes bump both after a deprecation window; prefer additive fields.

    **Errors:** `{ "error": true, "code": "...", "reason": "...", "status": 400 }`.
    Same envelope on every host (StructuredErrorMiddleware). Do not invent a
    parallel shape.

    **Platform differences:** expressed as `/api/system/capabilities` plus
    structured unsupported errors — never as missing fields or different VM/disk
    schemas.

    **SSE / WebSocket** are out-of-band (see `x-barkvisor-transport`). They are
    documented here so clients know they exist; they are not part of the JSON
    compatibility promise.

    **Tiers:**
    - stable — `/api/vms`, `/api/disks`, `/api/networks`, `/api/images`, `/api/auth`
    - evolving — `/api/agent/*`, `/api/pairing/*`, `/api/home/devices`, `/api/home/devices/health`, `/api/home/placement/score`, `/api/system/remote-access`, `/api/home/settings/remote-access`, `/api/apps` (apps reserved)
    - internal — `/api/home/devices/{id}/v1/*` mTLS member proxy
  x-barkvisor-api-version: 1
  x-barkvisor-version-header: X-BarkVisor-API-Version

servers:
  - url: /
    description: Same origin as the SPA / daemon

tags:
  - name: meta
  - name: auth
  - name: vms
  - name: disks
  - name: networks
  - name: images
  - name: evolving
  - name: out-of-band

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [meta]
      operationId: getHealth
      security: []
      x-barkvisor-stability: stable
      summary: Process health probe
      responses:
        "200":
          description: Probe result. `status` is `ok` when required checks pass.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessHealth"
        default:
          $ref: "#/components/responses/Error"

  /api/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenAPI
      security: []
      x-barkvisor-stability: stable
      summary: This OpenAPI document
      responses:
        "200":
          description: OpenAPI 3 YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/contract:
    get:
      tags: [meta]
      operationId: getContract
      security: []
      x-barkvisor-stability: stable
      summary: Version, stability tiers, and error envelope
      responses:
        "200":
          description: Contract summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIContractSummary"

  /api/workloadspec.schema.json:
    get:
      tags: [meta]
      operationId: getWorkloadSpecSchema
      security: []
      x-barkvisor-stability: stable
      summary: JSON Schema for WorkloadSpec (PAS-80)
      responses:
        "200":
          description: JSON Schema 2020-12
          content:
            application/schema+json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      x-barkvisor-stability: stable
      summary: Exchange username/password for a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT and opaque refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      security: []
      x-barkvisor-stability: stable
      summary: Rotate a refresh token and issue a new JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New JWT and rotated refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: []
      x-barkvisor-stability: stable
      summary: Revoke the presented refresh family, or all refresh tokens when a JWT is sent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Refresh tokens revoked
        default:
          $ref: "#/components/responses/Error"

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getAuthMe
      x-barkvisor-stability: stable
      summary: Current user id, username, and Home role (admin or inference)
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/login-offers:
    post:
      tags: [evolving]
      operationId: issueLoginOffer
      x-barkvisor-stability: evolving
      summary: Mint a short-lived phone sign-in QR (not pairing)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginOfferIssueRequest"
      responses:
        "200":
          description: Active sign-in offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOfferIssue"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [evolving]
      operationId: getLoginOffer
      x-barkvisor-stability: evolving
      summary: Current unused sign-in offer, if any
      responses:
        "200":
          description: Active sign-in offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOfferIssue"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [evolving]
      operationId: revokeLoginOffer
      x-barkvisor-stability: evolving
      summary: Drop the active sign-in offer
      responses:
        "204":
          description: Offer revoked
        default:
          $ref: "#/components/responses/Error"

  /api/auth/login-offers/redeem:
    post:
      tags: [evolving]
      operationId: redeemLoginOffer
      security: []
      x-barkvisor-stability: evolving
      summary: Exchange a sign-in QR code for a JWT and refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRedeemRequest"
      responses:
        "200":
          description: JWT and refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/passkeys/login/begin:
    post:
      tags: [evolving]
      operationId: beginPasskeyLogin
      security: []
      x-barkvisor-stability: evolving
      summary: Start a discoverable passkey login ceremony
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginBeginRequest"
      responses:
        "200":
          description: Challenge session and request options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremonyBegin"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/passkeys/login/finish:
    post:
      tags: [evolving]
      operationId: finishPasskeyLogin
      security: []
      x-barkvisor-stability: evolving
      summary: Finish passkey login and issue a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginFinishRequest"
      responses:
        "200":
          description: JWT and refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/passkeys:
    get:
      tags: [evolving]
      operationId: listPasskeys
      x-barkvisor-stability: evolving
      summary: List passkeys for the authenticated user
      responses:
        "200":
          description: Passkeys owned by the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasskeyCredential"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/passkeys/{id}:
    delete:
      tags: [evolving]
      operationId: deletePasskey
      x-barkvisor-stability: evolving
      summary: Delete one of the authenticated user's passkeys
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Passkey deleted
        default:
          $ref: "#/components/responses/Error"

  /api/auth/passkeys/register/begin:
    post:
      tags: [evolving]
      operationId: beginPasskeyRegister
      x-barkvisor-stability: evolving
      summary: Start a passkey registration ceremony
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterBeginRequest"
      responses:
        "200":
          description: Challenge session and creation options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremonyBegin"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/passkeys/register/finish:
    post:
      tags: [evolving]
      operationId: finishPasskeyRegister
      x-barkvisor-stability: evolving
      summary: Finish passkey registration and store the credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterFinishRequest"
      responses:
        "200":
          description: Stored passkey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCredential"
        default:
          $ref: "#/components/responses/Error"

  /api/vms:
    get:
      tags: [vms]
      operationId: listVMs
      x-barkvisor-stability: stable
      summary: List workloads
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: VM list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [vms]
      operationId: createVM
      x-barkvisor-stability: stable
      summary: Create a VM (optionally via WorkloadSpec)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVMRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "202":
          description: Provisioning in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMTaskAccepted"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [vms]
      operationId: getVM
      x-barkvisor-stability: stable
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [vms]
      operationId: updateVM
      x-barkvisor-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVMRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [vms]
      operationId: deleteVM
      x-barkvisor-stability: stable
      responses:
        "200":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/start:
    post:
      tags: [vms]
      operationId: startVM
      x-barkvisor-stability: stable
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/stop:
    post:
      tags: [vms]
      operationId: stopVM
      x-barkvisor-stability: stable
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/restart:
    post:
      tags: [vms]
      operationId: restartVM
      x-barkvisor-stability: stable
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/session/resume:
    post:
      tags: [vms]
      operationId: resumeCodingSession
      x-barkvisor-stability: evolving
      summary: Resume a stopped coding session (new TTL clock)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/session/reset:
    post:
      tags: [vms]
      operationId: resetCodingSession
      x-barkvisor-stability: evolving
      summary: Reset the boot disk to the Library image
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/session/burn:
    post:
      tags: [vms]
      operationId: burnCodingSession
      x-barkvisor-stability: evolving
      summary: Destroy the coding session Workload and unload the local-model grant
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "202":
          description: Delete accepted
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/attach-iso:
    post:
      tags: [vms]
      operationId: attachISO
      x-barkvisor-stability: stable
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/detach-iso:
    post:
      tags: [vms]
      operationId: detachISO
      x-barkvisor-stability: stable
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/usb:
    post:
      tags: [vms]
      operationId: attachUSB
      x-barkvisor-stability: stable
      summary: Attach a host USB device by stable id
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachUSBRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/gpu:
    post:
      tags: [vms]
      operationId: attachGPU
      x-barkvisor-stability: stable
      summary: Attach a host GPU by PCI address
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachGPURequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/gpu/{deviceId}:
    delete:
      tags: [vms]
      operationId: detachGPU
      x-barkvisor-stability: stable
      summary: Detach a GPU by PCI address
      parameters:
        - $ref: "#/components/parameters/id"
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
          description: PCI address (`0000:01:00.0`)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/usb/{deviceId}:
    delete:
      tags: [vms]
      operationId: detachUSB
      x-barkvisor-stability: stable
      summary: Detach a USB device by stable id
      parameters:
        - $ref: "#/components/parameters/id"
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
          description: Stable USB id (`vendorId:productId:serial` or `bus:BBB.AAA`)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/vms/{id}/spec:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [vms]
      operationId: getVMSpec
      x-barkvisor-stability: stable
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadSpec"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [vms]
      operationId: putVMSpec
      x-barkvisor-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkloadSpec"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        default:
          $ref: "#/components/responses/Error"

  /api/workloads/apply:
    post:
      tags: [vms]
      operationId: applyWorkload
      x-barkvisor-stability: stable
      summary: Server-side apply a WorkloadSpec (create or update)
      parameters:
        - name: dryRun
          in: query
          required: false
          schema:
            type: boolean
          description: Validate and return the planned op without writing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkloadSpec"
          application/yaml:
            schema:
              $ref: "#/components/schemas/WorkloadSpec"
      responses:
        "200":
          description: Apply result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadApplyResult"
        default:
          $ref: "#/components/responses/Error"

  /api/workloads/{id}/spec:
    get:
      tags: [vms]
      operationId: getWorkloadSpec
      x-barkvisor-stability: stable
      summary: Export the live WorkloadSpec for a workload
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadSpec"
        default:
          $ref: "#/components/responses/Error"

  /api/disks:
    get:
      tags: [disks]
      operationId: listDisks
      x-barkvisor-stability: stable
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Disk"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [disks]
      operationId: createDisk
      x-barkvisor-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiskRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disk"
        default:
          $ref: "#/components/responses/Error"

  /api/disks/summary:
    get:
      tags: [disks]
      operationId: diskSummary
      x-barkvisor-stability: stable
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageSummary"
        default:
          $ref: "#/components/responses/Error"

  /api/disks/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [disks]
      operationId: getDisk
      x-barkvisor-stability: stable
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disk"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [disks]
      operationId: deleteDisk
      x-barkvisor-stability: stable
      responses:
        "200":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /api/disks/{id}/usage:
    get:
      tags: [disks]
      operationId: diskUsage
      x-barkvisor-stability: stable
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiskUsage"
        default:
          $ref: "#/components/responses/Error"

  /api/disks/{id}/resize:
    post:
      tags: [disks]
      operationId: resizeDisk
      x-barkvisor-stability: stable
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResizeDiskRequest"
      responses:
        "200":
          description: Accepted or resized
        default:
          $ref: "#/components/responses/Error"

  /api/networks:
    get:
      tags: [networks]
      operationId: listNetworks
      x-barkvisor-stability: stable
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Network"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [networks]
      operationId: createNetwork
      x-barkvisor-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNetworkRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        default:
          $ref: "#/components/responses/Error"

  /api/networks/modes:
    get:
      tags: [networks]
      operationId: listNetworkModes
      x-barkvisor-stability: stable
      summary: Closed mode list with per-host support reasons
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NetworkModeCapability"
        default:
          $ref: "#/components/responses/Error"

  /api/networks/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    patch:
      tags: [networks]
      operationId: updateNetwork
      x-barkvisor-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNetworkRequest"
      responses:
        "200":
          content:
            application/json:
