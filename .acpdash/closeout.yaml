# ACPDash pins this policy from the project base branch for each issue revision.
# BDD scenarios, when declared on an issue, require Cucumber automatically.
version: 1
# Each command gets a fresh allowance after corrective feedback to its exhaustion question.
retry:
  maxFailedAttemptsPerItem: 5
items:
  - id: swift-lint
    kind: command
    run: mise run lint
    hint: Run SwiftLint and SwiftFormat through start_command with this item ID. This is the CI lint job. Fix every finding before the final commit.
  - id: swift-tests
    kind: command
    run: mise run test
    hint: Run the full native Swift test suite through start_command with this item ID. This is mise run test, the CI Test job, with no --filter. Fix failures; macOS-only checks also run in CI.
  - id: frontend-tests
    kind: command
    run: mise run frontend-test
    hint: Run frontend unit tests through start_command with this item ID against the final clean commit.
  # Use Claude (or another non-Codex provider) for implementation: the reviewer
  # must be independent, and Codex currently provides the read-only review path.
  - id: independent-review
    kind: review
    skill: acpdash-review
    providers: [codex]
    differentProvider: true
    failOn: P1
  - id: ci
    kind: ci
  - id: review-threads
    kind: reviewThreads
